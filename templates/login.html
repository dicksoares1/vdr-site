<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDR 442 - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 20% 30%, #1a1a1a, #0a0a0a);
        }
        .login-container {
            background: #141414;
            padding: 50px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 60px rgba(255, 107, 0, 0.08);
        }
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo h1 {
            color: #fff;
            font-size: 32px;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .logo h1 span {
            color: #FF6B00;
        }
        .logo .sub {
            color: #888;
            font-size: 13px;
            margin-top: 6px;
            letter-spacing: 4px;
        }
        .logo .tigre {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            color: #ccc;
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            background: #0d0d0d;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FF6B00;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.06);
        }
        .form-group input::placeholder {
            color: #444;
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: #FF6B00;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .btn-login:hover {
            background: #e85d00;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.25);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error {
            color: #ff4757;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 71, 87, 0.08);
            border-radius: 8px;
            border: 1px solid rgba(255, 71, 87, 0.15);
            display: {% if erro %}block{% else %}none{% endif %};
        }
        .footer {
            text-align: center;
            color: #333;
            font-size: 12px;
            margin-top: 25px;
            letter-spacing: 1px;
        }
        .footer span {
            color: #FF6B00;
        }
        .linha {
            width: 60px;
            height: 3px;
            background: #FF6B00;
            margin: 20px auto 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span class="tigre">🐯</span>
            <h1>VDR <span>442</span></h1>
            <div class="sub">SISTEMA DE GERENCIAMENTO</div>
            <div class="linha"></div>
        </div>
        <form method="POST">
            <div class="form-group">
                <label>👤 USUÁRIO</label>
                <input type="text" name="username" placeholder="Digite seu usuário" required autofocus>
            </div>
            <div class="form-group">
                <label>🔒 SENHA</label>
                <input type="password" name="password" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-login">ENTRAR</button>
            {% if erro %}
            <div class="error">❌ {{ erro }}</div>
            {% endif %}
        </form>
        <div class="footer">🛡 VDR 442 • <span>Vida Rasa</span></div>
    </div>
</body>
</html>
